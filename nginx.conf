server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for high-speed performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;

    # Video & Media streaming with Byte-Range support
    location ~* \.(mp4|webm|ogg)$ {
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static CSS and Fonts caching
    location ~* \.(css|js|woff|woff2|ttf|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Default location routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom 404 redirection
    error_page 404 /index.html;
}
